// shairport-sync on the Pixel (Termux). Classic AirPlay, AAudio output.
general = {
  name = "Pixel 9a";
  // Plays straight to Android's AAudio (patches/0003), and follows the output
  // when a USB DAC is plugged in or out.
  output_backend = "aaudio";
  mdns_backend = "tinysvcmdns";
  // Keeps sync by stretching or squeezing a packet by one frame. "basic" drops
  // or repeats a single sample instead, which clicks: a run of corrections
  // sounds like sand. The build has no "soxr": Termux's libsoxr crashed.
  interpolation = "vernier";
};

// Sync and network statistics every few seconds in ~/shairport.log, to see
// what happened if the sound ever goes wrong.
diagnostics = {
  statistics = "yes";
};
