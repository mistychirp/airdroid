// shairport-sync on the Pixel (Termux). Classic AirPlay, PulseAudio output.
general = {
  name = "Pixel 9a";
  output_backend = "pulseaudio";
  mdns_backend = "tinysvcmdns";
  // Keeps sync by occasionally inserting or dropping a single frame. The build
  // has no "soxr" (gentle resampling): Termux's libsoxr crashed with it.
  interpolation = "basic";
};

pulseaudio = {
  application_name = "AirPlay";
  // No fixed sink: airplay-run and airplay-switch-output set PulseAudio's
  // default to the current AAudio output. AAudio reports precise timing; the
  // OpenSL ES output's timing jitters by ~50 ms, which causes crackling.
};
